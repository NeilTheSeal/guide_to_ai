[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guide_to_ai"]

[project]
name = "guide-to-ai-exercises"
version = "0.1.0"
description = "Code-along exercises from a machine learning book"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.4",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.8",
  "pylint>=3.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
exclude = ["src/tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
filterwarnings = ["ignore::FutureWarning:keras.src.export.tf2onnx_lib"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]

[tool.pylint.main]
max-line-length = 120
ignore-paths = ["src/tests"]

[tool.pylint."messages control"]
disable = []
